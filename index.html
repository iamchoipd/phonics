<body><div class="wrap"><header class="header"><div><h1>🔤 소리톡톡 파닉스</h1><p>스마트폰 1인용 · 1~6단계 완성판</p></div><button id="soundToggle" aria-label="소리 켜기 또는 끄기">🔊</button></header>

function sound(ok){if(muted)return;try{let ac=sound.ctx||(sound.ctx=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();let now=ac.currentTime;[0,.11].forEach((d,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?[540,730][i]:[290,230][i];o.type='sine';g.gain.setValueAtTime(.001,now+d);g.gain.exponentialRampToValueAtTime(.075,now+d+.015);g.gain.exponentialRampToValueAtTime(.001,now+d+.115);o.start(now+d);o.stop(now+d+.12)})}catch(e){}}
function node(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(label,fn,cls='secondary'){let b=node('button',label,cls);b.type='button';b.addEventListener('click',fn);return b}
function current(){return session.deck[session.idx]}
function sayWord(item,slow=false){if(session.stage===1){playPhoneme(item.word)}else{speak(item.word,slow?.58:.8)}}
function playPiece(piece,item){if(session.stage===6){speak(piece,.72);return}if(session.stage===1){playPhoneme(item.word);return}const s=piece.toLowerCase();if(s.length===1||/^(sh|ch|th|ph|wh|ck|ng|ee|oo|ai|ay|oa|ow|ea|igh|ar|or|er|ir|ur)$/.test(s)){playPhoneme(s)}else if(s.length===2&&/^[bcdfghjklmnpqrstvwxyz]{2}$/.test(s)){playPhoneme(s)}else{speak(piece,.7)}}
function chooseDeck(p,n){return n==='all'?shuffle(p):shuffle(p).slice(0,Number(n))}
function start(){let stage=Number($('stage').value),all=poolFor(stage),deck=chooseDeck(all,$('amount').value);session={stage,mode,all,deck,idx:0,round:1,wrong:[],correct:0,firstTry:0,attempt:0,limit:mode==='game'?Number($('limit').value):0,started:Date.now(),deadline:0,done:false,missedTotal:0};session.deadline=session.limit?Date.now()+session.limit*1000:0;questionLock=false;$('setup').classList.add('hidden');$('play').classList.remove('hidden');clearInterval(tickId);tickId=setInterval(tick,250);render();window.scrollTo(0,0)}
function tick(){if(!session||session.done)return;if(session.deadline){let n=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));$('timer').textContent='⏱ '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n<=0)finish(true)}}
function next(){if(!session||session.done)return;session.idx++;session.attempt=0;questionLock=false;if(session.idx>=session.deck.length){if(session.mode==='game'&&session.round===1&&session.wrong.length){session.deck=shuffle(unique(session.wrong.map(x=>x.word))).map(w=>session.all.find(x=>x.word===w));session.round=2;session.idx=0;session.wrong=[]}else{finish(false);return}}render()}
function finish(timed){if(!session||session.done)return;session.done=true;clearInterval(tickId);$('tag').textContent=timed?'⏱ 시간이 끝났어요':'🎉 모든 문제 완료';$('counter').textContent='완료';$('bar').style.width='100%';$('prompt').textContent='오늘도 열심히 연습했어요!';$('feedback').textContent='';$('bottom').replaceChildren();let content=$('content');content.replaceChildren();let div=node('div',undefined,'finish');div.append(node('h2',timed?'시간 종료!':'학습 완료!'),node('div',session.correct+'개 정답','score'),node('p',`첫 시도 정답 ${session.firstTry}개 · 틀리거나 건너뛴 문제 ${session.missedTotal}회`,'muted'));div.append(button('🔁 다시 시작',start,'primary'));content.append(div);sound(true)}
function topView(){let s=session,item=current();$('stageName').textContent=s.stage+'단계 · '+(s.mode==='learn'?'학습':'게임');$('counter').textContent=`${s.idx+1} / ${s.deck.length}`;$('bar').style.width=(s.idx/s.deck.length*100)+'%';$('timer').textContent=s.limit?'⏱ --:--':'';$('tag').textContent=s.round===2?'🔁 틀린 문제 복습':descriptions[s.stage];$('feedback').textContent='';$('feedback').className='feedback';$('content').replaceChildren();$('bottom').replaceChildren();tick();return item}
function bigText(item,hide=false){let b=node('div',undefined,'bigword'+(session.stage===6?' sentence':''));let letters=session.stage===6?item.word.split(/(\s+)/):item.word.split('');for(let i=0;i<letters.length;i++){let ch=letters[i],sp=node('span',hide?'•':ch,hide?'mask':('aeiou'.includes(ch.toLowerCase())?'vowel':'consonant'));b.append(sp)}return b}
function actionBottom(item){let b=$('bottom');b.append(button('🔊 다시 듣기',()=>sayWord(item)),button('🐢 천천히 듣기',()=>sayWord(item,true)));}
function renderLearn(item){$('prompt').textContent=session.stage===6?'문장을 소리 내어 읽어 보세요.':session.stage===1?'낱글자 소리를 듣고 따라 해 보세요.':'소리 조각을 누른 뒤 전체 단어를 읽어 보세요.';let c=$('content');c.append(bigText(item));if(item.meaning)c.append(node('div',session.stage===1?`${item.ipa} · ${item.example} (${item.meaning})`:item.meaning,'ko'));else if(session.stage===3)c.append(node('div',`같은 끝소리: -${item.key}`,'ko'));else if(session.stage===4)c.append(node('div',`집중할 자음 조합: ${item.key}`,'ko'));else if(session.stage===5)c.append(node('div',`이번 소리 규칙: ${item.key.replace('_e','-e')}`,'ko'));else c.append(node('div','글자를 차례대로 눌러 보세요.','ko'));
let row=node('div',undefined,'segments');item.segments.forEach((part,i)=>{let b=button(part,()=>{playPiece(part,item);$('feedback').textContent=session.stage===1?`${item.word.toUpperCase()} ${item.ipa} · ${item.example}`:`${part} 소리를 듣고 따라 해요.`},'segment');if(session.stage===1)b.replaceChildren();if(session.stage===1){b.append(document.createTextNode(item.word.toUpperCase()),node('small',item.ipa))}row.append(b)});c.append(row);c.append(node('p',session.stage===1?'낱글자 버튼은 개별 소리입니다. 예시 단어는 아래 별도 버튼으로 들어 보세요.':session.stage===6?'문장 속 익숙한 단어를 찾아 읽고 전체를 연결하세요.':'각 조각을 읽은 뒤 이어 붙여 단어로 소리 내 보세요.','stepinfo'));let b=$('bottom');b.append(button(session.stage===1?'🔊 낱글자 소리':'🔊 전체 듣기',()=>sayWord(item),'secondary'),button(session.stage===1?'🍎 예시 단어 듣기':'🐢 느리게 듣기',()=>session.stage===1?speak(item.example,.76):sayWord(item,true),'secondary'),button('✅ 읽었어요 · 다음',()=>{session.correct++;session.firstTry++;sound(true);next()},'primary'),button('➡️ 다음으로',next,'outline'));}
function getChoices(item,correct,kind){let p=session.all.filter(x=>x.word!==item.word);if(session.stage===1){let candidates=shuffle(p).slice(0,3).map(x=>x.word.toUpperCase());return shuffle([correct,...candidates])}let same=p.filter(x=>x.key===item.key);let others=shuffle(same).concat(shuffle(p.filter(x=>x.key!==item.key)));return shuffle([correct,...unique(others.map(x=>x.word)).slice(0,3)])}
function answerWrong(item,btn){session.attempt++;session.missedTotal++;sound(false);btn.classList.add('bad');btn.disabled=true;if(session.attempt===1){$('feedback').textContent='한 번 더! 틀린 보기는 사라져요.';$('feedback').className='feedback bad'}else{questionLock=true;if(session.round===1)session.wrong.push(item);$('feedback').textContent='정답은 '+(session.stage===1?item.word.toUpperCase():item.word)+' · 소리를 듣고 기억해요.';$('feedback').className='feedback bad';sayWord(item);setTimeout(()=>{if(session&&!session.done&&questionLock)next()},1900)}}
function answerRight(item,btn){if(questionLock)return;questionLock=true;session.correct++;if(session.attempt===0)session.firstTry++;sound(true);btn.classList.add('good');$('feedback').textContent='🎉 정답! 잘했어요!';$('feedback').className='feedback good';setTimeout(()=>{if(session&&!session.done&&questionLock)next()},800)}
function multipleChoice(item){let c=$('content');c.append(node('div','🔊 발음을 듣고 정답을 선택하세요.','questionbox'));let choices=getChoices(item,session.stage===1?item.word.toUpperCase():item.word);let g=node('div',undefined,'answers');choices.forEach(w=>{let b=button(w,()=>{if(questionLock)return;if(w===(session.stage===1?item.word.toUpperCase():item.word))answerRight(item,b);else answerWrong(item,b)},'answer');g.append(b)});c.append(g)}
function missingLetter(item){let c=$('content'),word=item.word;let index=session.stage===2?1:Math.floor(Math.random()*word.length),letter=word[index];let label=word.slice(0,index)+' _ '+word.slice(index+1);c.append(node('div',label,'bigword'));c.append(node('div','빠진 글자를 선택해요.','ko'));let alphabet='abcdefghijklmnopqrstuvwxyz'.split('').filter(x=>x!==letter);let guesses=shuffle([letter,...shuffle(alphabet).slice(0,3)]);let g=node('div',undefined,'answers');guesses.forEach(ch=>{let b=button(ch,()=>{if(questionLock)return;if(ch===letter)answerRight(item,b);else answerWrong(item,b)},'answer');g.append(b)});c.append(g)}
function buildWord(item){let word=item.word;let c=$('content');c.append(node('div','🔊 들은 단어의 글자를 순서대로 눌러요.','questionbox'));let holder=node('div',undefined,'built');holder.append(node('span','? ? ?'));c.append(holder);let chars=shuffle(word.split('').map((ch,i)=>({ch,id:i})));let choiceArea=node('div',undefined,'answers');let chosen=[];function redraw(){holder.replaceChildren();if(!chosen.length)holder.append(node('span','글자를 눌러 조합하세요.'));chosen.forEach(x=>holder.append(node('span',x.ch)));[...choiceArea.children].forEach(b=>b.disabled=chosen.some(x=>x.id===Number(b.dataset.id)));}
chars.forEach(x=>{let b=button(x.ch,()=>{if(questionLock)return;chosen.push(x);redraw();if(chosen.length===word.length){let assembled=chosen.map(v=>v.ch).join('');if(assembled===word){answerRight(item,checkBtn)}else{session.attempt++;session.missedTotal++;sound(false);$('feedback').textContent=session.attempt===1?'다시 조합해 보세요!':'정답: '+word+' · 다음에 다시 만나요.';$('feedback').className='feedback bad';if(session.attempt>=2){questionLock=true;if(session.round===1)session.wrong.push(item);sayWord(item);setTimeout(()=>{if(session&&!session.done&&questionLock)next()},1700)}else{chosen=[];setTimeout(()=>{if(!questionLock)redraw()},600)}}}},'answer');b.dataset.id=x.id;choiceArea.append(b)});c.append(choiceArea);let checkBtn=node('span');let reset=button('↶ 글자 지우기',()=>{if(questionLock)return;chosen.pop();redraw()},'outline');$('bottom').append(reset);redraw()}
function skip(item){if(questionLock)return;questionLock=true;session.missedTotal++;if(session.round===1)session.wrong.push(item);$('feedback').textContent='복습할 문제에 넣었어요.';$('feedback').className='feedback bad';setTimeout(()=>{if(session&&!session.done&&questionLock)next()},500)}
function renderGame(item){$('prompt').textContent=session.stage===1?'낱글자 소리를 듣고 글자를 골라요.':session.stage===6?'문장을 듣고 같은 문장을 찾아요.':'영어 단어의 소리를 듣고 풀어 보세요.';let c=$('content');let kind=session.stage===1||session.stage===6?'choice':session.idx%3===1?'missing':session.idx%3===2?'build':'choice';if(session.stage===6){c.append(node('p','문장을 끝까지 듣고 정답을 찾아요.','stepinfo'))}if(kind==='choice'){if(session.stage===6){let choices=shuffle([item,...shuffle(session.all.filter(x=>x.word!==item.word)).slice(0,3)]);let g=node('div',undefined,'answers');choices.forEach(x=>{let b=button(x.word,()=>{if(questionLock)return;if(x.word===item.word)answerRight(item,b);else answerWrong(item,b)},'answer');b.style.fontSize='15px';g.append(b)});c.append(g)}else multipleChoice(item)}else if(kind==='missing')missingLetter(item);else buildWord(item);let b=$('bottom');b.append(button(session.stage===1?'🔊 낱글자 소리':'🔊 발음 듣기',()=>sayWord(item),'secondary'),button(session.stage===1?'🍎 예시 단어':'🐢 천천히',()=>session.stage===1?speak(item.example,.76):sayWord(item,true),'secondary'),button('⏭ 모르겠어요',()=>skip(item),'outline'));}
function render(){if(!session||session.done)return;let item=topView();if(session.mode==='learn')renderLearn(item);else renderGame(item)}
$('learnBtn').onclick=()=>{mode='learn';$('learnBtn').classList.add('on');$('gameBtn').classList.remove('on')};$('gameBtn').onclick=()=>{mode='game';$('gameBtn').classList.add('on');$('learnBtn').classList.remove('on')};$('start').onclick=start;$('home').onclick=()=>{clearInterval(tickId);stopPhoneme();if('speechSynthesis'in window)speechSynthesis.cancel();session=null;$('play').classList.add('hidden');$('setup').classList.remove('hidden');window.scrollTo(0,0)};$('restart').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();start()};$('soundToggle').onclick=()=>{muted=!muted;$('soundToggle').textContent=muted?'🔇':'🔊';if(muted){stopPhoneme();if('speechSynthesis'in window)speechSynthesis.cancel()}};document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPhoneme();if('speechSynthesis'in window)speechSynthesis.cancel()}});
})();
</script></body></html>
